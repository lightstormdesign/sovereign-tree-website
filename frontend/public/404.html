<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SovereignTree</title>
    <!-- GitHub Pages has no server-side routing, so a direct hit on any
         route other than / (e.g. /about) 404s. This is the standard
         spa-github-pages redirect trick: encode the path into a query
         string, redirect to the real index.html, then index.html's own
         inline script (see public/index.html) decodes it back with
         history.replaceState before React Router ever sees it. -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
        l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
